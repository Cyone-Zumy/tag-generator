<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狂鹿作战 词条选择器 1.0.0</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
    }
    body {
      background: #0b0e14;
      color: #e4e9f2;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .app {
      display: flex;
      width: 100%;
      height: 100%;
      max-width: 1800px;
      background: #14181f;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px #2e3a47 inset;
      overflow: hidden;
      backdrop-filter: blur(2px);
      margin: 0 auto;
    }
    .left-panel {
      flex: 3;
      min-width: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #2c3a4b;
    }
    .left-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('https://media.prts.wiki/5/53/Avg_pic_rogue_6_6.png') center/cover fixed no-repeat;
      opacity: 1;
      z-index: 0;
      pointer-events: none;
    }
    .toolbar, .tree-container, .h-slider-bar, .score-panel, .one-page-header, .one-page-footer {
      position: relative;
      z-index: 1;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      padding: 12px 20px;
      background: #1b212b;
      border-bottom: 1px solid #2f3d4e;
      z-index: 20;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar button {
      background: #28323f;
      border: none;
      color: #cfdbe9;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 0 1px #3f5063 inset;
      transition: all 0.2s ease;
    }
    .toolbar button:hover {
      background: #3b4a5e;
      color: white;
      box-shadow: 0 6px 12px #00000066, 0 0 0 1px #6d8bb0 inset;
      transform: translateY(-1px);
    }
    .toolbar button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 4px #00000066, 0 0 0 1px #6d8bb0 inset;
    }
    .code-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #11161e;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid #314052;
    }
    .code-area input {
      background: transparent;
      border: none;
      color: #b7cdff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 8px 0;
      width: 180px;
      outline: none;
    }
    .code-area input::placeholder {
      color: #4e6077;
      font-style: italic;
    }
    .code-area button {
      padding: 6px 16px;
      font-size: 0.8rem;
      background: #2f4055;
      box-shadow: 0 2px 6px #00000033;
    }
    .difficulty-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #11161e;
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid #314052;
      margin-left: 8px;
    }
    .difficulty-box label {
      font-size: 0.8rem;
      color: #8fa5bb;
      font-weight: 600;
      white-space: nowrap;
    }
    .difficulty-box input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: #0f131a;
      border: 1px solid #2f3d4e;
      outline: none;
    }
    .difficulty-box input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffaa33;
      border: 2px solid #1a0e0e;
      cursor: pointer;
      box-shadow: 0 0 8px #ffaa3388;
    }
    .difficulty-box input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffaa33;
      border: 2px solid #1a0e0e;
      cursor: pointer;
      box-shadow: 0 0 8px #ffaa3388;
    }
    .difficulty-box .diff-value {
      min-width: 28px;
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      color: #ffaa33;
      font-family: 'JetBrains Mono', monospace;
    }
    .tree-container {
      flex: 1;
      position: relative;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #3e5064 #1a212b;
    }
    .tree-container::-webkit-scrollbar {
      width: 8px;
      height: 0px;
    }
    .tree-container::-webkit-scrollbar-track {
      background: #1a212b;
      border-radius: 10px;
    }
    .tree-container::-webkit-scrollbar-thumb {
      background: #3e5064;
      border-radius: 10px;
      border: 1px solid #1a212b;
    }
    .tree-canvas {
      position: relative;
    }
    /* 水平滑动条 */
    .h-slider-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #1b212b;
      border-top: 1px solid #2f3d4e;
      flex-shrink: 0;
      z-index: 26;
    }
    .h-slider-btn {
      background: #28323f;
      border: none;
      color: #cfdbe9;
      width: 24px;
      height: 20px;
      border-radius: 12px;
      font-size: 0.6rem;
      cursor: pointer;
      box-shadow: 0 2px 4px #00000033, 0 0 0 1px #3f5063 inset;
      transition: all 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .h-slider-btn:hover { background: #3b4a5e; color: #fff; }
    .h-slider-track {
      position: relative;
      flex: 1;
      height: 12px;
      background: #0f131a;
      border: 1px solid #2f3d4e;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
    }
    .h-slider-thumb {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      min-width: 36px;
      background: linear-gradient(90deg, #ffaa33, #ff7700);
      border-radius: 8px;
      cursor: grab;
      transition: opacity 0.2s;
      box-shadow: 0 0 8px #ffaa3366;
    }
    .h-slider-thumb.dragging { cursor: grabbing; }
    .h-slider-thumb.disabled { opacity: 0.3; cursor: default; }
    .root-set-bg {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      border-radius: 0;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 1px #ffffff22 inset, 0 8px 24px #00000044;
      border: 1px solid #ffffff18;
      transition: box-shadow 0.2s;
    }
    .node {
      position: absolute;
      width: 100px;
      height: auto;
      border-radius: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      color: #fff;
      font-weight: 600;
      font-size: 0.7rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
      border: none;
      box-shadow: 0 4px 0 #0a0707;
      line-height: 1.2;
      padding: 0;
      word-break: break-word;
      overflow: hidden;
      box-sizing: border-box;
    }
    .node .node-inner {
      position: relative;
      z-index: 2;
      flex: 0 0 100px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px;
      border-radius: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    .node .node-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0;
      filter: drop-shadow(0 2px 2px #000);
    }
    /* 词条底部的黑色分数区域（扩大后固定显示分数） */
    .node .score-badge {
      position: relative;
      z-index: 3;
      flex: 0 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 24px;
      background: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: none;
      box-sizing: border-box;
      line-height: 1;
    }
    .node[data-depth="0"] { font-size: 0.8rem; }
    .node[data-depth="1"] { font-size: 0.8rem; }
    .node[data-depth="2"] { font-size: 0.8rem; }
    .node[data-depth="3"] { font-size: 0.8rem; }
    .node.selected {
      background-color: transparent;
      color: #fff;
    }
    .node.disabled {
      opacity: 0.4;
      filter: grayscale(1);
      cursor: not-allowed;
      pointer-events: none;
      background-color: #1a1a1a;
      box-shadow: none;
    }
    .node:not(.disabled):hover {
      box-shadow: 0 0 15px #408080, 0 4px 0 #4a0a0a;
      z-index: 30;
    }
    .node:focus {
      outline: none;
    }
    .line-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }
    .line-path {
      fill: none;
      stroke: #DFDFDF;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.75;
      transition: stroke 0.2s;
    }
    .line-path.active {
      stroke: url(#activeLineFill);
      opacity: 1;
    }
    .root-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #14181f;
      border: 3px solid #DFDFDF;
      z-index: 5;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: all 0.2s;
    }
    .root-dot.active {
      border-color: url(#activeLineFill);
      background: #2a1e1e;
    }
    .right-panel {
      flex: 1;
      min-width: 300px;
      background: url('https://media.prts.wiki/e/e1/Avg_pic_rogue_6_23.png') center/cover fixed no-repeat;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #25303d;
      overflow: hidden;
    }
    .selected-header {
      padding: 20px 20px 12px 20px;
      border-bottom: 1px solid #26313e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151c25;
      box-shadow: 0 4px 12px #00000033;
    }
    .selected-header h2 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #b6d0ea;
      text-shadow: 0 0 12px #3a73a8;
    }
    .selected-header span {
      background: #293644;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #b0cef0;
      font-weight: 600;
    }
    .text-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 30px 16px;
      scrollbar-width: thin;
      scrollbar-color: #3e5064 #1a212b;
      scroll-behavior: smooth;
    }
    .text-scroll::-webkit-scrollbar { width: 6px; }
    .text-scroll::-webkit-scrollbar-track { background: #1a212b; }
    .text-scroll::-webkit-scrollbar-thumb { background: #3e5064; border-radius: 10px; }
    .text-entry {
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #1a232f;
      border-radius: 8px;
      border-left: 4px solid #cc3333;
      box-shadow: 0 4px 10px #00000033, 0 0 0 1px #2b3c4e inset;
      transition: all 0.2s;
      animation: fadeSlide 0.3s ease;
      color: #cbdae9;
    }
    .text-entry .entry-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #ff8866;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .text-entry .entry-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
      color: #dfeaf5;
      margin-bottom: 6px;
    }
    .text-entry .entry-score {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffaa33;
      letter-spacing: 0.5px;
    }
    .text-entry.highlight {
      border-left-color: #ffaa33;
      background: #2f241d;
      box-shadow: 0 0 0 2px #ffaa33, 0 6px 14px #00000055;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .empty-message {
      color: #596b7e;
      font-style: italic;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
      border: 1px dashed #2d3e50;
      border-radius: 20px;
      margin-top: 20px;
    }
    .tooltip {
      position: fixed;
      background: #2a1e1e;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      max-width: 260px;
      box-shadow: 0 10px 25px #000000, 0 0 0 1px #cc3333 inset;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s;
      border-left: 6px solid #cc3333;
    }
    .toolbar-group { display: flex; gap: 6px; }
    .root-actions {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 40;
      pointer-events: auto;
      transform: translateX(-50%);
    }
    .root-actions button {
      background: #28323f;
      border: none;
      color: #cfdbe9;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), 0 0 0 1px #3f5063 inset;
      transition: all 0.15s ease;
      white-space: nowrap;
      backdrop-filter: blur(2px);
      width: 100%;
      text-align: center;
    }
    .root-actions button:hover {
      background: #3b4a5e;
      color: #fff;
      box-shadow: 0 5px 10px #00000066, 0 0 0 1px #6d8bb0 inset;
      transform: translateY(-1px);
    }
    .root-actions button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 4px #00000066, 0 0 0 1px #6d8bb0 inset;
    }
    .root-actions .select-root-btn::before { content: "✅ "; font-size: 0.65rem; margin-right: 2px; }
    .root-actions .deselect-root-btn::before { content: "❌ "; font-size: 0.65rem; margin-right: 2px; }
    .score-panel {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      background: rgba(20, 24, 31, 0.92);
      border: 1px solid #3f5063;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 0 1px #2e3a47 inset;
      pointer-events: none;
      min-width: 160px;
      backdrop-filter: blur(4px);
      font-weight: 800;
      color: #e4e9f2;
    }
    .score-panel .score-title {
      font-size: 0.75rem;
      color: #8fa5bb;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .score-panel .score-total {
      font-size: 1.5rem;
      color: #ffaa33;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .score-panel .score-root-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.8rem;
      color: #cbdae9;
      padding: 2px 0;
    }
    .score-panel .score-root-row .root-id { color: #ff8866; }
    .score-panel .score-root-row .root-score { color: #ffdd88; }
    .export-img-btn {
      background: #2f4055;
      border: none;
      color: #cfdbe9;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 0 1px #3f5063 inset;
      transition: all 0.2s ease;
    }
    .export-img-btn:hover {
      background: #3b4a5e;
      color: white;
      transform: translateY(-1px);
    }
    .contract-conflict {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: transparent !important;
      z-index: 9999;
      border-radius: 0;
      pointer-events: none;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
    }
    .contract-conflict .cf-char {
      position: absolute;
      color: #ffffff;
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,1);
    }
    .contract-conflict .cf-char:nth-child(1) { top: 2px; left: 4px; }
    .contract-conflict .cf-char:nth-child(2) { top: 2px; right: 4px; }
    .contract-conflict .cf-char:nth-child(3) { bottom: 2px; left: 4px; }
    .contract-conflict .cf-char:nth-child(4) { bottom: 2px; right: 4px; }

    .export-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    .export-modal.active { display: flex; }
    .export-content {
      background: #14181f;
      border-radius: 20px;
      max-width: 900px;
      width: 96%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px #000;
      border: 1px solid #2f3d4e;
    }
    .export-content h2 {
      color: #b6d0ea;
      margin-bottom: 16px;
      font-size: 1.3rem;
    }
    .export-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2a3644;
    }
    .export-section h3 {
      color: #8fa5bb;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .export-bg-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #1a232f;
      padding: 8px 12px;
      border-radius: 10px;
      flex-wrap: wrap;
    }
    .export-bg-row .bg-name { flex: 1; color: #cbdae9; font-size: 0.85rem; white-space: nowrap; }
    .export-bg-row button { padding: 6px 14px; font-size: 0.75rem; }
    .export-bg-row img {
      width: 60px; height: 36px; object-fit: cover; border-radius: 6px;
      border: 1px solid #2f3d4e;
    }
    .export-input-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .export-input-row input[type="text"] { flex: 1; }
    .export-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }
    .export-actions button {
      padding: 10px 24px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .export-actions .primary { background: #2f4055; color: #cfdbe9; }
    .export-actions .secondary { background: #2a1e1e; color: #cfdbe9; }

    .bg-crop-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .bg-crop-modal.active { display: flex; }
    .bg-crop-content {
      background: #14181f;
      border-radius: 16px;
      padding: 20px;
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px #000;
    }
    .bg-crop-content h3 { color: #b6d0ea; margin-bottom: 12px; }
    .bg-crop-canvas-wrap {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      cursor: move;
    }
    .bg-crop-canvas-wrap canvas { display: block; max-width: 100%; }
    .bg-crop-slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #8fa5bb;
    }
    .bg-crop-slider-row input[type="range"] { flex: 1; }
    .bg-crop-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .bg-crop-actions button {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .one-page-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      padding: 20px 40px 0 40px;
    }
    .one-page-header .player-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .one-page-header .player-info .label {
      font-size: 0.9rem;
      color: #8fa5bb;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .one-page-header .player-info .name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px #000;
      line-height: 1.1;
    }
    .one-page-header .avatar {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      object-fit: cover;
      border: 3px solid #ffffff44;
      box-shadow: 0 4px 16px #000;
      background: #2a1e1e;
    }
    .one-page-footer {
      position: relative;
      margin: 0 30px 30px 30px;
      padding: 20px 40px;
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px #00000055;
      overflow: hidden;
    }
    .one-page-footer .score-label {
      position: relative;
      z-index: 1;
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px #000;
    }
    .one-page-footer .score-number {
      position: relative;
      z-index: 1;
      font-size: 16.5rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 0.9;
      text-shadow: 0 4px 12px #000;
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="left-panel" id="leftPanel">
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <button id="selectAllBtn">✅ 全选</button>
        <button id="deselectAllBtn">❌ 取消全选</button>
      </div>
      <button id="exportBtn">📋 导出代码</button>
      <button id="importBtn">📥 导入代码</button>
      <button id="exportImageBtn" class="export-img-btn">🖼️ 导出一图流</button>
      <div class="difficulty-box">
        <label>难度</label>
        <input type="range" id="difficultySlider" min="0" max="18" step="1" value="12" />
        <span class="diff-value" id="difficultyDisplay">12</span>
      </div>
      <div class="code-area">
        <input type="text" id="codeInput" placeholder="粘贴词条代码, 如 1.1,2.1.2..." />
        <button id="applyCodeBtn">应用</button>
      </div>
    </div>
    <div class="tree-container" id="treeContainer" tabindex="0"></div>
    <div class="h-slider-bar" id="hSliderBar">
      <button class="h-slider-btn" id="hScrollLeftBtn" title="向左滚动">◀</button>
      <div class="h-slider-track" id="hSliderTrack">
        <div class="h-slider-thumb" id="hSliderThumb"></div>
      </div>
      <button class="h-slider-btn" id="hScrollRightBtn" title="向右滚动">▶</button>
    </div>
    <div class="score-panel" id="scorePanel">
      <div class="score-title">总分</div>
      <div class="score-total" id="scoreTotal">0</div>
      <div id="scoreRootList"></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="selected-header">
      <h2>已选词条</h2>
      <span id="selectedCount">0</span>
    </div>
    <div class="text-scroll" id="textScroll"></div>
  </div>
</div>

<div class="export-modal" id="exportModal">
  <div class="export-content">
    <h2>🖼️ 生成一图流</h2>
    <div class="export-section">
      <h3>指标集背景</h3>
      <div id="exportBgList"></div>
    </div>
    <div class="export-section">
      <h3>总分区域背景</h3>
      <div class="export-input-row">
        <label style="color:#8fa5bb;font-size:0.85rem; white-space:nowrap;">背景类型：</label>
        <select id="scoreBgType" style="flex:1;background:#0f131a;color:#dfeaf5;border:1px solid #2f3d4e;border-radius:8px;padding:8px;">
          <option value="theme">主题色</option>
          <option value="gradient">渐变</option>
          <option value="texture">纹理</option>
          <option value="image">上传图片</option>
        </select>
        <button id="uploadScoreBgBtn" style="display:none;padding:6px 14px;font-size:0.75rem;">上传图片</button>
        <input type="file" id="scoreBgFileInput" accept="image/*" style="display:none;" />
      </div>
      <div class="export-input-row">
        <label style="color:#8fa5bb;font-size:0.85rem; white-space:nowrap;">透明度：</label>
        <input type="range" id="scoreBgOpacity" min="0" max="100" value="100" class="range-slider" />
        <span id="scoreBgOpacityValue" style="color:#8fa5bb;font-size:0.85rem; width:40px; text-align:right;">100%</span>
      </div>
    </div>
    <div class="export-section">
      <h3>选手信息</h3>
      <div class="export-input-row">
        <input type="text" id="playerNameInput" placeholder="选手名称" value="天离beta" style="background:#0f131a;color:#dfeaf5;border:1px solid #2f3d4e;border-radius:8px;padding:10px;" />
        <button id="uploadAvatarBtn" style="padding:8px 16px;">上传头像</button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" />
        <img id="avatarPreview" style="width:48px;height:48px;border-radius:10px;object-fit:cover;display:none;border:1px solid #2f3d4e;" />
      </div>
    </div>
    <div class="export-actions">
      <button class="secondary" id="exportCancelBtn">取消</button>
      <button class="primary" id="exportConfirmBtn">确认生成</button>
    </div>
  </div>
</div>

<div class="bg-crop-modal" id="bgCropModal">
  <div class="bg-crop-content">
    <h3>✂️ 裁剪背景</h3>
    <div class="bg-crop-canvas-wrap" id="bgCropWrap">
      <canvas id="bgCropCanvas"></canvas>
    </div>
    <div class="bg-crop-slider-row">
      <span>缩放</span>
      <input type="range" id="bgCropZoom" min="0.1" max="5" step="0.01" value="1" />
      <span id="bgCropZoomValue">100%</span>
    </div>
    <div class="bg-crop-actions">
      <button class="secondary" id="bgCropCancelBtn">取消</button>
      <button class="primary" id="bgCropConfirmBtn">确认</button>
    </div>
  </div>
</div>

  const nodeMap = new Map();
  nodesData.forEach(n => {
    n.parents = [];
    if (n.parent) n.parents.push(n.parent);
    if (n.extraParents) {
      n.extraParents.forEach(p => {
        if (nodeMap.has(p) && !n.parents.includes(p)) n.parents.push(p);
      });
    }
    nodeMap.set(n.id, { ...n, children: [] });
  });

  nodesData.forEach(n => {
    if (n.parent && nodeMap.has(n.parent)) {
      nodeMap.get(n.parent).children.push(n.id);
    }
  });

  nodeMap.forEach((node, id) => {
    node.parents = [];
    if (node.parent) node.parents.push(node.parent);
    if (node.extraParents) {
      node.extraParents.forEach(p => {
        if (nodeMap.has(p) && !node.parents.includes(p)) node.parents.push(p);
      });
    }
  });

  function getDepth(id) {
    let depth = 0;
    let cur = id;
    while (nodeMap.get(cur)?.parent) {
      depth++;
      cur = nodeMap.get(cur).parent;
    }
    return depth;
  }

  const conflictGroups = new Map();
  nodesData.forEach(n => {
    if (n.conflictGroup && n.parent) {
      const key = `${n.parent}_${n.conflictGroup}`;
      if (!conflictGroups.has(key)) conflictGroups.set(key, []);
      conflictGroups.get(key).push(n.id);
    }
  });

  function dynamicScore(x) {
    const base = 5 * x;
    const extra = x > 10 ? (x - 10) * (x - 10) : 0;
    return base + extra;
  }

  function getEffectiveScore(node) {
    if (!node) return 0;
    if (node.dynamic) return dynamicScore(difficulty);
    return typeof node.score === 'number' ? node.score : 0;
  }

  function parseNodeTitle(node) {
    let title = node.name || node.desc?.slice(0, 10) || node.id;
    if (title.length > 10) title = title.slice(0, 9) + '…';
    return title;
  }

  function hexToRgb(hex) {
    const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
    if (!m) return {r:255,g:170,b:51};
    return { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) };
  }

  let textureImageData = null;
  let textureLoaded = false;
  function loadTextureImage() {
    if (!fillTextureImage || fillType !== 'texture' || !useFill) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      textureImageData = ctx.getImageData(0, 0, c.width, c.height);
      textureLoaded = true;
    };
    img.src = fillTextureImage;
  }
  loadTextureImage();

  let selectedIds = new Set();
  let lastToggledId = null;

  function hasConflict(id) {
    const node = nodeMap.get(id);
    if (!node.conflictGroup || !node.parent) return false;
    const key = `${node.parent}_${node.conflictGroup}`;
    const groupIds = conflictGroups.get(key) || [];
    for (let otherId of groupIds) {
      if (otherId !== id && selectedIds.has(otherId)) return true;
    }
    return false;
  }

  function getAncestors(id) {
    const result = new Set();
    const queue = [...(nodeMap.get(id)?.parents || [])];
    while (queue.length) {
      const pid = queue.shift();
      if (!pid || result.has(pid)) continue;
      result.add(pid);
      const pnode = nodeMap.get(pid);
      if (pnode) pnode.parents?.forEach(pp => queue.push(pp));
    }
    return Array.from(result);
  }

  function refreshNodeStates() {
    const container = document.getElementById('treeContainer');
    const nodeDivs = container.querySelectorAll('.node');
    nodeDivs.forEach(div => {
      const id = div.dataset.id;
      const selected = selectedIds.has(id);
      const conflict = hasConflict(id);
      
      div.classList.toggle('selected', selected);
      div.classList.remove('disabled');
      
      const existingTag = div.querySelector('.contract-conflict');
      if (existingTag) existingTag.remove();

      const inner = div.querySelector('.node-inner');
      const badge = div.querySelector('.score-badge');

      if (conflict && !selected) {
        div.style.setProperty('height', '100px', 'important');
        if (useFill) {
          div.style.setProperty('background-color', 'transparent', 'important');
        } else {
          div.style.setProperty('background-color', globalThemeColor, 'important');
        }
        if (inner) {
          inner.style.setProperty('background-image', 'none', 'important');
          inner.style.setProperty('display', 'none', 'important');
        }
        if (badge) badge.style.setProperty('display', 'none', 'important');


        const tag = document.createElement('div');
        tag.className = 'contract-conflict';
        tag.innerHTML = `
          <span class="cf-char">合</span>
          <span class="cf-char">约</span>
          <span class="cf-char">冲</span>
          <span class="cf-char">突</span>
        `;
        div.appendChild(tag);
      } else {
        div.style.removeProperty('height');
        div.style.removeProperty('background-image');
        div.style.removeProperty('background-color');
        if (inner) {
          inner.style.removeProperty('background-image');
          inner.style.removeProperty('background-color');
          inner.style.removeProperty('display');
        }
        if (badge) badge.style.removeProperty('display');
      }

    });
  }

  function cascadeDeselect(id) {
    const node = nodeMap.get(id);
    if (!node) return;
    node.children.forEach(childId => {
      if (selectedIds.has(childId)) {
        selectedIds.delete(childId);
        cascadeDeselect(childId);
      }
    });
  }

  function resolveConflictFor(id) {
    const node = nodeMap.get(id);
    if (!node || !node.conflictGroup || !node.parent) return;
    const key = `${node.parent}_${node.conflictGroup}`;
    const groupIds = conflictGroups.get(key) || [];
    for (let otherId of groupIds) {
      if (otherId !== id && selectedIds.has(otherId)) {
        selectedIds.delete(otherId);
        cascadeDeselect(otherId);
      }
    }
  }

  function selectAncestorChain(id) {
    const ancestors = getAncestors(id).sort((a,b) => getDepth(a) - getDepth(b));
    for (const anc of ancestors) {
      if (selectedIds.has(anc)) continue;
      if (hasConflict(anc)) continue;
      resolveConflictFor(anc);
      selectedIds.add(anc);
    }
  }

  function selectNode(id) {
    if (selectedIds.has(id)) return false;
    const node = nodeMap.get(id);
    if (!node) return false;
    resolveConflictFor(id);
    selectAncestorChain(id);
    selectedIds.add(id);
    return true;
  }

  function deselectNode(id) {
    if (!selectedIds.has(id)) return false;
    selectedIds.delete(id);
    cascadeDeselect(id);
    return true;
  }

  function toggleNode(id) {
    if (selectedIds.has(id)) {
      deselectNode(id);
      lastToggledId = null;
    } else {
      if (selectNode(id)) {
        lastToggledId = id;
      } else {
        return;
      }
    }
    refreshNodeStates();
    updateCount();
    renderTextPanelWithScroll(lastToggledId);
    updateLineHighlights();
    updateAllNodeAppearance();
  }

  function getNodesUnderRoot(rootId) {
    const result = new Set();
    function dfs(id) {
      result.add(id);
      const node = nodeMap.get(id);
      if (node) node.children.forEach(child => dfs(child));
    }
    dfs(rootId);
    return result;
  }

  function getNodeScore(id) {
    const node = nodeMap.get(id);
    return getEffectiveScore(node);
  }

  function selectAll() {
    selectedIds.clear();
    const allIds = nodesData.map(n => n.id).sort((a, b) => {
      const da = getDepth(a), db = getDepth(b);
      if (da !== db) return da - db;
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    });
    const blocked = new Set();
    for (const id of allIds) {
      let cur = id;
      let ancestorBlocked = false;
      while (nodeMap.get(cur)?.parent) {
        cur = nodeMap.get(cur).parent;
        if (blocked.has(cur)) { ancestorBlocked = true; break; }
      }
      if (ancestorBlocked) { blocked.add(id); continue; }
      if (selectedIds.has(id)) continue;
      if (hasConflict(id)) { blocked.add(id); continue; }
      const ok = selectNode(id);
      if (!ok) blocked.add(id);
    }
    refreshNodeStates();
    updateCount();
    renderTextPanelWithScroll(null);
    updateLineHighlights();
    updateAllNodeAppearance();
  }

  function deselectAll() {
    selectedIds.clear();
    refreshNodeStates();
    updateCount();
    renderTextPanelWithScroll(null);
    updateLineHighlights();
    updateAllNodeAppearance();
  }

  function selectRoot(rootId) {
    const rootNodes = getNodesUnderRoot(rootId);
    const candidateIds = Array.from(rootNodes);
    if (!selectedIds.has(rootId)) selectedIds.add(rootId);
    const childCandidates = candidateIds.filter(id => id !== rootId);
    const conflictMap = new Map();
    const nonConflictIds = [];
    childCandidates.forEach(id => {
      const node = nodeMap.get(id);
      if (node && node.conflictGroup && node.parent) {
        const key = `${node.parent}_${node.conflictGroup}`;
        if (!conflictMap.has(key)) conflictMap.set(key, []);
        conflictMap.get(key).push(id);
      } else {
        nonConflictIds.push(id);
      }
    });
    rootNodes.forEach(id => {
      if (id !== rootId && selectedIds.has(id)) {
        selectedIds.delete(id);
        cascadeDeselect(id);
      }
    });
    nonConflictIds.forEach(id => {
      if (!selectedIds.has(id)) {
        resolveConflictFor(id);
        selectAncestorChain(id);
        selectedIds.add(id);
      }
    });
    conflictMap.forEach((ids, key) => {
      let bestId = null;
      let bestScore = -1;
      ids.forEach(id => {
        const score = getNodeScore(id);
        if (score > bestScore) {
          bestScore = score;
          bestId = id;
        } else if (score === bestScore && bestId !== null) {
          if (id.localeCompare(bestId, undefined, { numeric: true, sensitivity: 'base' }) < 0) {
            bestId = id;
          }
        }
      });
      if (bestId) {
        selectAncestorChain(bestId);
        if (!hasConflict(bestId)) {
          selectedIds.add(bestId);
        } else {
          const node = nodeMap.get(bestId);
          if (node.conflictGroup && node.parent) {
            const k = `${node.parent}_${node.conflictGroup}`;
            const gIds = conflictGroups.get(k) || [];
            for (let otherId of gIds) {
              if (otherId !== bestId && selectedIds.has(otherId)) {
                selectedIds.delete(otherId);
                cascadeDeselect(otherId);
              }
            }
          }
          selectedIds.add(bestId);
        }
      }
    });
    refreshNodeStates();
    updateCount();
    renderTextPanelWithScroll(null);
    updateLineHighlights();
    updateAllNodeAppearance();
  }

  function deselectRoot(rootId) {
    const rootNodes = getNodesUnderRoot(rootId);
    rootNodes.forEach(id => {
      if (selectedIds.has(id)) selectedIds.delete(id);
    });
    refreshNodeStates();
    updateCount();
    renderTextPanelWithScroll(null);
    updateLineHighlights();
    updateAllNodeAppearance();
  }

  function renderTextPanelWithScroll(targetId) {
    const scrollContainer = document.getElementById('textScroll');
    const selectedArray = Array.from(selectedIds).filter(id => nodeMap.has(id));
    selectedArray.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
    if (selectedArray.length === 0) {
      scrollContainer.innerHTML = `<div class="empty-message">⚡ 尚未选择任何词条<br><span style="font-size:0.75rem;">点击左侧图标开始</span></div>`;
      return;
    }
    let html = '';
    selectedArray.forEach(id => {
      const node = nodeMap.get(id);
      if (!node) return;
      const score = getEffectiveScore(node);
      html += `
        <div class="text-entry" data-id="${id}">
          <div class="entry-id">${id}</div>
          <div class="entry-desc">${node.desc}</div>
          <div class="entry-score">▲+${score}</div>
        </div>
      `;
    });
    scrollContainer.innerHTML = html;
    if (targetId) {
      const targetEl = scrollContainer.querySelector(`.text-entry[data-id="${targetId}"]`);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        targetEl.classList.add('highlight');
        setTimeout(() => targetEl.classList.remove('highlight'), 800);
      }
    }
  }

  function updateCount() {
    document.getElementById('selectedCount').textContent = selectedIds.size;
    updateScorePanel();
  }

  function updateScorePanel() {
    const roots = nodesData.filter(n => !n.parent).map(n => n.id);
    let total = 0;
    const rootScores = new Map();
    roots.forEach(r => rootScores.set(r, 0));
    selectedIds.forEach(id => {
      const node = nodeMap.get(id);
      if (!node) return;
      const score = getEffectiveScore(node);
      total += score;
      let cur = id;
      while (nodeMap.get(cur)?.parent) cur = nodeMap.get(cur).parent;
      if (rootScores.has(cur)) rootScores.set(cur, rootScores.get(cur) + score);
    });
    document.getElementById('scoreTotal').textContent = total;
    const listEl = document.getElementById('scoreRootList');
    listEl.innerHTML = roots.map(r => `
      <div class="score-root-row">
        <span class="root-id">${r}</span>
        <span class="root-score">▲+${rootScores.get(r)}</span>
      </div>
    `).join('');
  }

  let occupiedGrid = new Map();
  let maxCols = new Map();
  let maxRows = new Map();

  function getRootNodeId(id) {
    let cur = id;
    while (nodeMap.get(cur)?.parent) cur = nodeMap.get(cur).parent;
    return cur;
  }

  function rebuildGrid() {
    occupiedGrid.clear();
    maxCols.clear();
    maxRows.clear();

    const roots = nodesData.filter(n => !n.parent);

    const sorted = [...nodesData].sort((a, b) => {
      if (a.gridX !== null && b.gridX === null) return -1;
      if (a.gridX === null && b.gridX !== null) return 1;
      return a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' });
    });

    sorted.forEach(n => {
      if (n.gridX !== null && n.gridY !== null) {
        const key = `${n.gridX},${n.gridY}`;
        if (!occupiedGrid.has(key)) {
          occupiedGrid.set(key, n.id);
          n._gx = n.gridX;
          n._gy = n.gridY;
          const rootId = getRootNodeId(n.id);
          maxCols.set(rootId, Math.max(maxCols.get(rootId) || 0, n.gridX));
          maxRows.set(rootId, Math.max(maxRows.get(rootId) || 0, n.gridY));
        }
      }
    });

    roots.forEach(root => {
      if (!maxCols.has(root.id)) maxCols.set(root.id, 0);
      if (!maxRows.has(root.id)) maxRows.set(root.id, 0);
    });

    for (let iter = 0; iter < 10; iter++) {
      let changed = false;
      nodesData.forEach(n => {
        if (n._gx !== undefined) return;
        
        const rootId = getRootNodeId(n.id);
        const parent = n.parent ? nodeMap.get(n.parent) : null;
        
        let targetX = 0, targetY = 0;
        if (parent) {
          targetX = (parent._gx || 0) + 1;
          if (!n._gy) {
            let candidateY = 1;
            let found = false;
            while (!found) {
              const key = `${targetX},${candidateY}`;
              if (!occupiedGrid.has(key)) {
                found = true;
                targetY = candidateY;
              } else {
                candidateY++;
              }
            }
          }
        } else {
          targetX = 0;
          targetY = (maxRows.get(rootId) || 0) + 1;
          if (targetY === 1) targetY = 1; 
          while (occupiedGrid.has(`${targetX},${targetY}`)) {
            targetY++;
          }
        }
        
        while (occupiedGrid.has(`${targetX},${targetY}`)) {
          targetX++;
        }
        
        const key = `${targetX},${targetY}`;
        occupiedGrid.set(key, n.id);
        n._gx = targetX;
        n._gy = targetY;
        maxCols.set(rootId, Math.max(maxCols.get(rootId) || 0, targetX));
        maxRows.set(rootId, Math.max(maxRows.get(rootId) || 0, targetY));
        changed = true;
      });
      if (!changed) break;
    }

    nodesData.forEach(n => {
      if (n._gx === undefined) {
        n._gx = 0;
        n._gy = 0;
      }
    });
  }

  function shiftRightFrom(startX, startY, minX) {
    const nodesToShift = [];
    nodesData.forEach(n => {
      if (n._gx >= minX && n._gy >= startY) {
        nodesToShift.push(n);
      }
    });
    nodesToShift.sort((a, b) => b._gx - a._gx);
    nodesToShift.forEach(n => {
      const oldKey = `${n._gx},${n._gy}`;
      let targetX = n._gx + 1;
      while (occupiedGrid.has(`${targetX},${n._gy}`)) {
        targetX++;
      }
      occupiedGrid.delete(oldKey);
      n._gx = targetX;
      occupiedGrid.set(`${targetX},${n._gy}`, n.id);
    });
  }

  function updateNodePosition(id, newX, newY) {
    const node = nodeMap.get(id);
    if (!node) return;
    const dataNode = nodesData.find(n => n.id === id);
    const curX = (node._gx !== undefined) ? node._gx : (dataNode ? dataNode._gx : 0);
    const curY = (node._gy !== undefined) ? node._gy : (dataNode ? dataNode._gy : 0);
    const oldKey = `${curX},${curY}`;
    const newKey = `${newX},${newY}`;
    if (oldKey === newKey) return;

    if (occupiedGrid.has(newKey) && occupiedGrid.get(newKey) !== id) {
      shiftRightFrom(newX, newY, newX);
    }
    occupiedGrid.delete(oldKey);
    occupiedGrid.set(newKey, id);
    node._gx = newX;
    node._gy = newY;
    if (dataNode) {
      dataNode._gx = newX;
      dataNode._gy = newY;
    }

    const rootId = getRootNodeId(id);
    maxCols.set(rootId, Math.max(maxCols.get(rootId) || 0, newX));
    maxRows.set(rootId, Math.max(maxRows.get(rootId) || 0, newY));

    buildTreeLayout();
  }

  function getSideCenter(pos, side) {
    switch(side) {
      case 'top': return { x: pos.centerX, y: pos.y };
      case 'bottom': return { x: pos.centerX, y: pos.y + pos.h };
      case 'left': return { x: pos.x, y: pos.centerY };
      case 'right': return { x: pos.x + pos.w, y: pos.centerY };
      default: return { x: pos.centerX, y: pos.centerY };
    }
  }

  function autoStartSide(parentPos, childPos) {
    const dx = childPos.centerX - parentPos.centerX;
    const dy = childPos.centerY - parentPos.centerY;
    if (Math.abs(dx) > Math.abs(dy)) {
      return dx > 0 ? 'right' : 'left';
    } else {
      return dy > 0 ? 'bottom' : 'top';
    }
  }

  function autoEndSide(startSide) {
    return {top:'bottom', bottom:'top', left:'right', right:'left'}[startSide] || 'top';
  }

  function roundedPolyline(points, r) {
    if (points.length < 2) return '';
    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length - 1; i++) {
      const p0 = points[i-1], p1 = points[i], p2 = points[i+1];
      const v1 = { x: p1.x - p0.x, y: p1.y - p0.y };
      const v2 = { x: p2.x - p1.x, y: p2.y - p1.y };
      const len1 = Math.hypot(v1.x, v1.y);
      const len2 = Math.hypot(v2.x, v2.y);
      const rr = Math.min(r, len1/2, len2/2);
      if (rr <= 0) {
        d += ` L ${p1.x} ${p1.y}`;
        continue;
      }
      const d1 = { x: v1.x / len1, y: v1.y / len1 };
      const d2 = { x: v2.x / len2, y: v2.y / len2 };
      const start = { x: p1.x - d1.x * rr, y: p1.y - d1.y * rr };
      const end = { x: p1.x + d2.x * rr, y: p1.y + d2.y * rr };
      d += ` L ${start.x} ${start.y} Q ${p1.x} ${p1.y} ${end.x} ${end.y}`;
    }
    const last = points[points.length-1];
    d += ` L ${last.x} ${last.y}`;
    return d;
  }

  function buildConnectionPath(parentId, parentPos, childPos, node) {
    const cfg = (node.lineConfig && node.lineConfig[parentId]) || {};
    let startSide = cfg.startSide;
    let endSide = cfg.endSide;
    if (!startSide) startSide = autoStartSide(parentPos, childPos);
    if (!endSide) endSide = autoEndSide(startSide);

    const s = getSideCenter(parentPos, startSide);
    const e = getSideCenter(childPos, endSide);
    const isStartHorizontal = startSide === 'left' || startSide === 'right';
    const isEndHorizontal = endSide === 'left' || endSide === 'right';
    const r = 10;

    if (isStartHorizontal && isEndHorizontal && s.y === e.y) {
      return `M ${s.x} ${s.y} L ${e.x} ${e.y}`;
    }
    if (!isStartHorizontal && !isEndHorizontal && s.x === e.x) {
      return `M ${s.x} ${s.y} L ${e.x} ${e.y}`;
    }

    if (isStartHorizontal !== isEndHorizontal) {
      let corner;
      if (isStartHorizontal) {
        corner = { x: e.x, y: s.y };
      } else {
        corner = { x: s.x, y: e.y };
      }
      return roundedPolyline([s, corner, e], r);
    }

    const offset = 30;
    if (isStartHorizontal) {
      const dist = Math.abs(s.x - e.x);
      const actualOffset = Math.min(offset, dist / 2);
      let midX;
      if (e.x > s.x) midX = e.x - actualOffset;
      else midX = e.x + actualOffset;
      return roundedPolyline([s, { x: midX, y: s.y }, { x: midX, y: e.y }, e], r);
    } else {
      const dist = Math.abs(s.y - e.y);
      const actualOffset = Math.min(offset, dist / 2);
      let midY;
      if (e.y > s.y) midY = e.y - actualOffset;
      else midY = e.y + actualOffset;
      return roundedPolyline([s, { x: s.x, y: midY }, { x: e.x, y: midY }, e], r);
    }
  }

  // ===== 水平滑动条 =====
  function updateHSliderBar() {
    const cont = document.getElementById('treeContainer');
    const track = document.getElementById('hSliderTrack');
    const thumb = document.getElementById('hSliderThumb');
    if (!cont || !track || !thumb) return;
    const trackW = track.clientWidth;
    if (!trackW) return;
    const maxScroll = cont.scrollWidth - cont.clientWidth;
    if (maxScroll <= 1) {
      thumb.classList.add('disabled');
      thumb.style.width = '100%';
      thumb.style.left = '0px';
      return;
    }
    thumb.classList.remove('disabled');
    const ratio = cont.clientWidth / Math.max(cont.scrollWidth, 1);
    const thumbW = Math.max(36, trackW * ratio);
    const maxLeft = trackW - thumbW;
    const left = (cont.scrollLeft / maxScroll) * maxLeft;
    thumb.style.width = thumbW + 'px';
    thumb.style.left = Math.max(0, Math.min(maxLeft, left)) + 'px';
  }

  (function initHSlider() {
    const cont = document.getElementById('treeContainer');
    const track = document.getElementById('hSliderTrack');
    const thumb = document.getElementById('hSliderThumb');
    const leftBtn = document.getElementById('hScrollLeftBtn');
    const rightBtn = document.getElementById('hScrollRightBtn');
    if (!cont || !track || !thumb) return;

    let dragging = false, startX = 0, startLeft = 0;

    thumb.addEventListener('mousedown', (e) => {
      if (thumb.classList.contains('disabled')) return;
      dragging = true;
      startX = e.clientX;
      startLeft = parseFloat(thumb.style.left) || 0;
      thumb.classList.add('dragging');
      e.preventDefault();
      e.stopPropagation();
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const maxScroll = cont.scrollWidth - cont.clientWidth;
      const trackW = track.clientWidth;
      const thumbW = thumb.offsetWidth;
      const maxLeft = Math.max(1, trackW - thumbW);
      const newLeft = Math.max(0, Math.min(maxLeft, startLeft + (e.clientX - startX)));
      thumb.style.left = newLeft + 'px';
      cont.scrollLeft = (newLeft / maxLeft) * maxScroll;
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      thumb.classList.remove('dragging');
    });

    track.addEventListener('mousedown', (e) => {
      if (e.target === thumb) return;
      const rect = track.getBoundingClientRect();
      const thumbW = thumb.offsetWidth;
      const maxScroll = cont.scrollWidth - cont.clientWidth;
      if (maxScroll <= 0) return;
      const clickX = e.clientX - rect.left;
      const maxLeft = Math.max(1, rect.width - thumbW);
      const targetLeft = Math.max(0, Math.min(maxLeft, clickX - thumbW / 2));
      cont.scrollLeft = (targetLeft / maxLeft) * maxScroll;
      updateHSliderBar();
    });

    leftBtn.addEventListener('click', () => cont.scrollBy({ left: -cont.clientWidth * 0.6, behavior: 'smooth' }));
    rightBtn.addEventListener('click', () => cont.scrollBy({ left: cont.clientWidth * 0.6, behavior: 'smooth' }));

    cont.addEventListener('scroll', updateHSliderBar);
    window.addEventListener('resize', updateHSliderBar);

    // Shift + 滚轮 = 水平滚动
    cont.addEventListener('wheel', (e) => {
      if (e.shiftKey) {
        e.preventDefault();
        cont.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  })();

  function buildTreeLayout() {
    const treeContainer = document.getElementById('treeContainer');
    const prevScrollLeft = treeContainer.scrollLeft;
    const prevScrollTop = treeContainer.scrollTop;

    treeContainer.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'tree-canvas';
    treeContainer.appendChild(container);

    const roots = nodesData.filter(n => !n.parent).map(n => n.id);

    const baseNodeSize = 100;
    const gapX = 60;
    const gapY = 60;
    const startX = 80;
    const startY = 80;

    const posMap = new Map();

    nodesData.forEach(n => {
      const px = startX + (n._gx || 0) * (baseNodeSize + gapX);
      const py = startY + (n._gy || 0) * (baseNodeSize + gapY);
      posMap.set(n.id, { x: px, y: py, w: baseNodeSize, h: baseNodeSize, centerX: px + baseNodeSize / 2, centerY: py + baseNodeSize / 2 });
      n._px = px;
      n._py = py;
      n._pw = baseNodeSize;
      n._ph = baseNodeSize;

      const mapNode = nodeMap.get(n.id);
      if (mapNode) {
        mapNode._px = px;
        mapNode._py = py;
        mapNode._pw = baseNodeSize;
        mapNode._ph = baseNodeSize;
        mapNode._gx = n._gx;
        mapNode._gy = n._gy;
      }
    });

    let maxX = 0, maxY = 0;
    posMap.forEach(pos => {
      maxX = Math.max(maxX, pos.x + pos.w + 100);
      maxY = Math.max(maxY, pos.y + pos.h + 100);
    });
    const cw = Math.max(maxX, 1200);
    const ch = Math.max(maxY, 1600);
    container.style.width = `${cw}px`;
    container.style.height = `${ch}px`;

    // 计算所有节点的包围盒以缩小渐变跨度
    let minX = Infinity, minY = Infinity, maxRX = -Infinity, maxBY = -Infinity;
    nodesData.forEach(n => {
      const px = n._px;
      const py = n._py;
      minX = Math.min(minX, px);
      minY = Math.min(minY, py);
      maxRX = Math.max(maxRX, px + n._pw);
      maxBY = Math.max(maxBY, py + n._ph);
    });
    if (nodesData.length === 0) { minX = 0; maxRX = 1200; minY = 0; maxBY = 1600; }
    const gx = Math.max(maxRX - minX, 1);
    const gy = Math.max(maxBY - minY, 1);
    const gradCx = minX + gx / 2;
    const gradCy = minY + gy / 2;
    const gradR = Math.max(gx, gy);
    const rad = gradientAngle * Math.PI / 180;
    const x1 = gradCx - Math.cos(rad) * gradR / 2;
    const y1 = gradCy - Math.sin(rad) * gradR / 2;
    const x2 = gradCx + Math.cos(rad) * gradR / 2;
    const y2 = gradCy + Math.sin(rad) * gradR / 2;

    roots.forEach(rootId => {
      const rootPos = posMap.get(rootId);
      if (!rootPos) return;
      let rootMinX = rootPos.x, rootMinY = rootPos.y, rootMaxRX = rootPos.x + rootPos.w, rootMaxBY = rootPos.y + rootPos.h;
      const all = getNodesUnderRoot(rootId);
      all.forEach(id => {
        const p = posMap.get(id);
        if (p) {
          rootMinX = Math.min(rootMinX, p.x);
          rootMinY = Math.min(rootMinY, p.y);
          rootMaxRX = Math.max(rootMaxRX, p.x + p.w);
          rootMaxBY = Math.max(rootMaxBY, p.y + p.h);
        }
      });
      const pad = 30;
      const bgDiv = document.createElement('div');

    function updateAllNodeAppearance() {
    document.querySelectorAll('.node').forEach(div => {
      const id = div.dataset.id;
      const node = nodeMap.get(id);
      const inner = div.querySelector('.node-inner');
      if (!inner) return;

      if (hasConflict(id)) {
        inner.style.setProperty('background-image', 'none', 'important');
        div.style.border = '';
        div.style.borderImage = '';
        div.style.boxShadow = '';
        return;
      }

      const depth = div.dataset.depth;
      const isSelected = selectedIds.has(id);

      if (!isSelected) {
        inner.style.backgroundColor = useFill ? 'transparent' : '';
        if (!useFill) {
          if (depth === "0") inner.style.backgroundColor = '#4a1e1e';
          else if (depth === "1") inner.style.backgroundColor = '#3e2020';
          else if (depth === "2") inner.style.backgroundColor = '#2f1818';
          else if (depth === "3") inner.style.backgroundColor = '#251212';
        }

        if (node && node.icon) {
          inner.style.backgroundImage = `url(${node.icon})`;
        } else {
          inner.style.backgroundImage = '';
        }
        inner.style.backgroundSize = 'cover';
        inner.style.backgroundPosition = 'center';
        inner.style.backgroundRepeat = 'no-repeat';

        div.style.border = '';
        div.style.boxShadow = '0 4px 0 #0a0707';
      } else {
        inner.style.backgroundColor = useFill ? 'transparent' : '#aa2222';

        if (node && node.icon) {
          let iconUrl = node.icon;
          if (node.isBinarized) {
            if (invertedIconCache.has(id)) {
              iconUrl = invertedIconCache.get(id);
            } else {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => {
                if (hasConflict(id)) return;
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                  if (a === 0) continue;
                  if (r > 128 && g > 128 && b > 128) {
                    data[i+3] = 0;
                  } else {
                    data[i] = 255; data[i+1] = 255; data[i+2] = 255; data[i+3] = 255;
                  }
                }
                ctx.putImageData(imgData, 0, 0);
                invertedIconCache.set(id, canvas.toDataURL());
                updateAllNodeAppearance();
              };
              img.src = node.icon;
            }
          }
          inner.style.backgroundImage = `url(${iconUrl})`;
        } else {
          inner.style.backgroundImage = '';
        }
        inner.style.backgroundSize = 'cover';
        inner.style.backgroundPosition = 'center';
        inner.style.backgroundRepeat = 'no-repeat';

        div.style.border = '';
        div.style.boxShadow = '0 4px 0 #0a0707';
      }
    });
  }

  let exportBgData = {};

  let bgCropImage = null;
  let bgCropCanvas = null;
  let bgCropCtx = null;
  let bgCropScale = 1;
  let bgCropOffset = { x: 0, y: 0 };
  let bgCropAspect = 4;
  let bgCropCallback = null;

  function clampOffset(offset, imgSize, canvasSize) {
    if (imgSize <= canvasSize) {
      return Math.max(0, Math.min(canvasSize - imgSize, offset));
    } else {
      return Math.max(canvasSize - imgSize, Math.min(0, offset));
    }
  }

  function openBgCropModal(imageSrc, aspectRatio, callback) {
    const modal = document.getElementById('bgCropModal');
    const wrap = document.getElementById('bgCropWrap');
    bgCropCanvas = document.getElementById('bgCropCanvas');
    bgCropCtx = bgCropCanvas.getContext('2d');
    bgCropAspect = aspectRatio;

    const maxW = Math.min(600, window.innerWidth - 80);
    const displayW = maxW;
    const displayH = Math.round(displayW / aspectRatio);
    bgCropCanvas.width = displayW;
    bgCropCanvas.height = displayH;
    bgCropCanvas.style.width = displayW + 'px';
    bgCropCanvas.style.height = displayH + 'px';
    wrap.style.width = displayW + 'px';
    wrap.style.height = displayH + 'px';

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      bgCropImage = img;
      bgCropScale = Math.max(displayW / img.width, displayH / img.height);
      bgCropOffset = {
        x: (displayW - img.width * bgCropScale) / 2,
        y: (displayH - img.height * bgCropScale) / 2
      };
      bgCropOffset.x = clampOffset(bgCropOffset.x, img.width * bgCropScale, displayW);
      bgCropOffset.y = clampOffset(bgCropOffset.y, img.height * bgCropScale, displayH);
      document.getElementById('bgCropZoom').value = bgCropScale;
      document.getElementById('bgCropZoomValue').textContent = Math.round(bgCropScale * 100) + '%';
      drawBgCrop();
      modal.classList.add('active');
    };
    img.src = imageSrc;
    bgCropCallback = callback;
  }

  function drawBgCrop() {
    if (!bgCropImage) return;
    bgCropCtx.clearRect(0, 0, bgCropCanvas.width, bgCropCanvas.height);
    bgCropCtx.drawImage(bgCropImage, bgCropOffset.x, bgCropOffset.y, bgCropImage.width * bgCropScale, bgCropImage.height * bgCropScale);
  }

  function closeBgCropModal() {
    document.getElementById('bgCropModal').classList.remove('active');
    bgCropImage = null;
    bgCropCallback = null;
  }

  (function() {
    const wrap = document.getElementById('bgCropWrap');
    let dragging = false;
    let lastX = 0, lastY = 0;
    wrap.addEventListener('mousedown', (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging || !bgCropImage) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      bgCropOffset.x += dx;
      bgCropOffset.y += dy;
      bgCropOffset.x = clampOffset(bgCropOffset.x, bgCropImage.width * bgCropScale, bgCropCanvas.width);
      bgCropOffset.y = clampOffset(bgCropOffset.y, bgCropImage.height * bgCropScale, bgCropCanvas.height);
      drawBgCrop();
    });
    window.addEventListener('mouseup', () => { dragging = false; });
  })();

  document.getElementById('bgCropZoom').addEventListener('input', (e) => {
    if (!bgCropImage) return;
    const newScale = parseFloat(e.target.value);
    const canvasW = bgCropCanvas.width;
    const canvasH = bgCropCanvas.height;
    const cx = canvasW / 2;
    const cy = canvasH / 2;
    const imgX = (cx - bgCropOffset.x) / bgCropScale;
    const imgY = (cy - bgCropOffset.y) / bgCropScale;
    bgCropScale = newScale;
    bgCropOffset.x = cx - imgX * bgCropScale;
    bgCropOffset.y = cy - imgY * bgCropScale;
    bgCropOffset.x = clampOffset(bgCropOffset.x, bgCropImage.width * bgCropScale, canvasW);
    bgCropOffset.y = clampOffset(bgCropOffset.y, bgCropImage.height * bgCropScale, canvasH);
    document.getElementById('bgCropZoomValue').textContent = Math.round(bgCropScale * 100) + '%';
    drawBgCrop();
  });

  document.getElementById('bgCropCancelBtn').addEventListener('click', closeBgCropModal);

    const ctx = out.getContext('2d');
    ctx.drawImage(bgCropImage, bgCropOffset.x, bgCropOffset.y, bgCropImage.width * bgCropScale, bgCropImage.height * bgCropScale);
    const dataUrl = out.toDataURL('image/png');
    const cb = bgCropCallback;
    closeBgCropModal();

              const preview = row.querySelector('img');
              preview.src = dataUrl;
              preview.style.display = 'block';
            });
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });
      const slider = row.querySelector(`input[data-root-opacity="${root.id}"]`);
      const valSpan = row.querySelector(`span[data-root-opacity-val="${root.id}"]`);
      slider.addEventListener('input', () => {
        if (!exportBgData[root.id]) exportBgData[root.id] = { image: '' };
        exportBgData[root.id].opacity = parseInt(slider.value);
        valSpan.textContent = slider.value + '%';
      });
    });

    const scoreBgType = document.getElementById('scoreBgType');
    const uploadScoreBgBtn = document.getElementById('uploadScoreBgBtn');
    const scoreBgFileInput = document.getElementById('scoreBgFileInput');
    scoreBgType.addEventListener('change', () => {
      scoreBgSetting.type = scoreBgType.value;
      uploadScoreBgBtn.style.display = scoreBgSetting.type === 'image' ? 'inline-block' : 'none';
    });
    uploadScoreBgBtn.onclick = () => scoreBgFileInput.click();
    scoreBgFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        openBgCropModal(ev.target.result, 6, (dataUrl) => {
          scoreBgSetting = { type: 'image', image: dataUrl };
        });
      };
      reader.readAsDataURL(file);
      scoreBgFileInput.value = '';
    };
    document.getElementById('scoreBgOpacity').value = scoreBgOpacity;
    document.getElementById('scoreBgOpacityValue').textContent = scoreBgOpacity + '%';

    const playerNameInput = document.getElementById('playerNameInput');
    playerNameInput.value = playerName;
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const avatarPreview = document.getElementById('avatarPreview');
    uploadAvatarBtn.onclick = () => avatarFileInput.click();
    avatarFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        openBgCropModal(ev.target.result, 1, (dataUrl) => {
          avatarData = dataUrl;
          avatarPreview.src = dataUrl;
          avatarPreview.style.display = 'block';
        });
      };
      reader.readAsDataURL(file);
      avatarFileInput.value = '';
    };
    if (avatarData) {
      avatarPreview.src = avatarData;
      avatarPreview.style.display = 'block';
    } else {
      avatarPreview.style.display = 'none';
    }

    modal.classList.add('active');
  });

  document.getElementById('scoreBgOpacity').addEventListener('input', (e) => {
    scoreBgOpacity = parseInt(e.target.value);
    document.getElementById('scoreBgOpacityValue').textContent = scoreBgOpacity + '%';
  });

  document.getElementById('exportCancelBtn').addEventListener('click', () => {
    document.getElementById('exportModal').classList.remove('active');
  });

  document.getElementById('exportConfirmBtn').addEventListener('click', async () => {
    const modal = document.getElementById('exportModal');
    modal.classList.remove('active');

    playerName = document.getElementById('playerNameInput').value.trim() || '选手';
    scoreBgSetting.type = document.getElementById('scoreBgType').value;
    scoreBgOpacity = parseInt(document.getElementById('scoreBgOpacity').value);

    const leftPanel = document.getElementById('leftPanel');
    const toolbar = document.getElementById('toolbar');
    const treeContainer = document.getElementById('treeContainer');
    const scorePanel = document.getElementById('scorePanel');
    const hSliderBar = document.getElementById('hSliderBar');

    const treeCanvasEl = treeContainer.querySelector('.tree-canvas');
    const contentW = treeCanvasEl ? treeCanvasEl.offsetWidth : treeContainer.clientWidth;
    const contentH = treeCanvasEl ? treeCanvasEl.offsetHeight : treeContainer.clientHeight;

    const origPadding = leftPanel.style.padding;
    const origHeight = leftPanel.style.height;
    const origWidth = leftPanel.style.width;
    const origOverflow = leftPanel.style.overflow;
    const origDisplay = leftPanel.style.display;
    const origToolbarDisplay = toolbar.style.display;
    const origScorePanelDisplay = scorePanel.style.display;
    const origTreeOverflow = treeContainer.style.overflow;
    const origTreeWidth = treeContainer.style.width;
    const origTreeHeight = treeContainer.style.height;

    toolbar.style.display = 'none';
    scorePanel.style.display = 'none';
    hSliderBar.style.display = 'none';

    leftPanel.style.display = 'block';
    leftPanel.style.width = contentW + 'px';
    leftPanel.style.height = 'auto';
    leftPanel.style.overflow = 'visible';
    leftPanel.style.padding = '0';

    treeContainer.style.overflow = 'visible';
    treeContainer.style.width = contentW + 'px';
    treeContainer.style.height = contentH + 'px';
    treeContainer.scrollLeft = 0;
    treeContainer.scrollTop = 0;

    Object.keys(exportBgData).forEach(rootId => {
      const bgEl = document.querySelector(`.root-set-bg[data-root="${rootId}"]`);
      if (bgEl && exportBgData[rootId].image) {
        bgEl.style.backgroundImage = `url(${exportBgData[rootId].image})`;
        bgEl.style.opacity = exportBgData[rootId].opacity / 100;
      }
    });

    let footerBgStyle = '';
    if (scoreBgSetting.type === 'theme') {
      footerBgStyle = `background: ${globalThemeColor};`;
    } else if (scoreBgSetting.type === 'gradient') {
      footerBgStyle = `background: linear-gradient(${gradientAngle}deg, ${gradientColor1}, ${gradientColor2});`;
    } else if (scoreBgSetting.type === 'texture' && fillTextureImage) {
      footerBgStyle = `background: url(${fillTextureImage}) center/cover;`;
    } else if (scoreBgSetting.type === 'image' && scoreBgSetting.image) {
      footerBgStyle = `background: url(${scoreBgSetting.image}) center/cover;`;
    } else {
      footerBgStyle = `background: #1a232f;`;
    }

    let total = 0;
    selectedIds.forEach(id => {
      const node = nodeMap.get(id);
      if (node) total += getEffectiveScore(node);
    });

    const header = document.createElement('div');
    header.className = 'one-page-header';
    header.innerHTML = `
      <div class="player-info">
        <div class="label">当前选手</div>
        <div class="name">${playerName}</div>
      </div>
      ${avatarData ? `<img class="avatar" src="${avatarData}" />` : '<div class="avatar"></div>'}
    `;
    leftPanel.insertBefore(header, leftPanel.firstChild);

    const footer = document.createElement('div');
    footer.className = 'one-page-footer';
    footer.innerHTML = `
      <div style="position:absolute; top:0; left:0; right:0; bottom:0; ${footerBgStyle} opacity: ${scoreBgOpacity / 100}; pointer-events: none;"></div>
      <div class="score-label">当前评分</div>
      <div class="score-number">${total}</div>
    `;
    leftPanel.appendChild(footer);

    await new Promise(resolve => setTimeout(resolve, 300));

    try {
      const canvas = await html2canvas(leftPanel, {
        backgroundColor: '#0b0e14',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        scrollX: 0,
        scrollY: 0,
        windowWidth: leftPanel.scrollWidth,
        windowHeight: leftPanel.scrollHeight
      });
      const link = document.createElement('a');
      link.download = '狂鹿作战_一图流.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      console.error(err);
      alert('导出图片失败：' + err.message);
    } finally {
      leftPanel.removeChild(header);
      leftPanel.removeChild(footer);
      toolbar.style.display = origToolbarDisplay || '';
      scorePanel.style.display = origScorePanelDisplay || '';
      hSliderBar.style.display = '';
      leftPanel.style.padding = origPadding;
      leftPanel.style.height = origHeight;
      leftPanel.style.width = origWidth;
      leftPanel.style.overflow = origOverflow;
      leftPanel.style.display = origDisplay;

      treeContainer.style.overflow = origTreeOverflow || '';
      treeContainer.style.width = origTreeWidth || '';
      treeContainer.style.height = origTreeHeight || '';

      document.querySelectorAll('.root-set-bg').forEach(bgEl => {
        const rootId = bgEl.dataset.root;
        if (setBgImage) {
          bgEl.style.backgroundImage = `url('${setBgImage}')`;
          bgEl.style.opacity = '1';
        } else {
          bgEl.style.backgroundImage = '';
          bgEl.style.background = 'linear-gradient(135deg, #2a1e1e55, #14181f88)';
          bgEl.style.opacity = '1';
        }
      });

      requestAnimationFrame(updateHSliderBar);
    }
  });

  window.addEventListener('load', () => {
    rebuildGrid();
    buildTreeLayout();

    document.getElementById('exportBtn').addEventListener('click', exportCode);
    document.getElementById('importBtn').addEventListener('click', importCode);
    document.getElementById('applyCodeBtn').addEventListener('click', importCode);

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') importCode();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.node')) hideTooltip();
    });

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      selectAll();
      updateAllNodeAppearance();
    });
    document.getElementById('deselectAllBtn').addEventListener('click', () => {
      deselectAll();
      updateAllNodeAppearance();
    });

    const slider = document.getElementById('difficultySlider');
    const display = document.getElementById('difficultyDisplay');
    slider.addEventListener('input', () => {
      difficulty = parseInt(slider.value);
      display.textContent = difficulty;
      applyDifficultyChange();
    });
  });
</script>
</body>
</html>
